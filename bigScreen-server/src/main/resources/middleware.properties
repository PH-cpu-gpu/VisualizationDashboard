app.alias=监控大屏服务

rpc.protocol.name=t3
rpc.protocol.port=12301
rpc.trace.log=true
rpc.registry.session=30000

rpc.provider.readwrite.enable=false

# ZooKeeper registry
app.registry.address=127.0.0.1:2181
rpc.registry.address=127.0.0.1:2181

#rabbitmq
hs.mq.binder.local_rabbit.type=rabbit
hs.mq.binder.local_rabbit.address=172.24.3.159:5672,172.24.3.160:5672,172.24.3.161:5672
hs.mq.binder.local_rabbit.username=rabbitmq
hs.mq.binder.local_rabbit.password=rabbitmq
hs.mq.binder.local_rabbit.vhost=client

#bigScreen database
hs.datasource.default.driver-class-name=oracle.jdbc.driver.OracleDriver
hs.datasource.default.url=jdbc:oracle:thin:@localhost:1521:XE
hs.datasource.default.username=bigScreen
hs.datasource.default.password=123

mybatis.mapperLocations=classpath:/mapper/*.xml
mybatis.configuration.mapUnderscoreToCamelCase=true
